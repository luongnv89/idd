name: dist-check

on:
  pull_request:
  push:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Source-level checks (fast fail before build)
        run: bash tests/test-init-template-doc-urls-source.sh

      - name: test-idd-lint
        run: bash tests/test-idd-lint.sh

      - name: test-idd-lint-stats-project
        run: bash tests/test-idd-lint-stats-project.sh

      # build.sh: compile → verify dist/skills → promote skills/ only on success
      - name: Build and verify skills (update skills/ on success)
        run: ./scripts/build.sh

      - name: Drift check — committed skills/ must match verified build
        run: |
          if ! git diff --exit-code -- skills/; then
            echo "::error::skills/ is out of date. Run ./scripts/build.sh and commit the result."
            exit 1
          fi

      - name: test-build-script
        run: bash tests/test-build-script.sh

      - name: test-init-template-doc-urls-dist
        run: bash tests/test-init-template-doc-urls-dist.sh

      - name: test-flattened-self-contained
        run: bash tests/test-flattened-self-contained.sh

      - name: test-autopilot-portability
        run: bash tests/test-autopilot-portability.sh

      - name: test-flattened-coexistence
        run: bash tests/test-flattened-coexistence.sh

      - name: test-dependency-closure
        run: bash tests/test-dependency-closure.sh

      - name: test-build-determinism
        run: bash tests/test-build-determinism.sh

      - name: test-skill-line-cap
        run: bash tests/test-skill-line-cap-247.sh

      - name: test-consolidated-blocks
        run: bash tests/test-consolidated-blocks-248.sh

      - name: test-bundled-doc-slimming
        run: bash tests/test-bundled-doc-slimming-249.sh

      - name: test-disclosure-gates
        run: bash tests/test-disclosure-gates-250.sh

      - name: test-scripts-pipeline-251
        run: bash tests/test-scripts-pipeline-251.sh

      - name: test-scripts-252
        run: bash tests/test-scripts-252.sh

      - name: test-scripts-253
        run: bash tests/test-scripts-253.sh

      - name: test-secscan-contract-272
        run: bash tests/test-secscan-contract-272.sh

      - name: test-autopilot-dependency-cross-repo-192
        run: bash tests/test-autopilot-dependency-cross-repo-192.sh

      - name: test-issue-triage
        run: bash tests/test-issue-triage.sh

      - name: test-issue-creator-modes
        run: bash tests/test-issue-creator-modes.sh

      - name: test-issue-analysis
        run: bash tests/test-issue-analysis.sh
