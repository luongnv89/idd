      - name: test-gi-state-cleanup-349
        run: bash tests/test-gi-state-cleanup-349.sh

      - name: test-resolver-borrow-skills-309
        run: bash tests/test-resolver-borrow-skills-309.sh

      - name: test-autopilot-triage-cache-258
        run: bash tests/test-autopilot-triage-cache-258.sh

