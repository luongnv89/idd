name: dist-check

on:
  pull_request:
  push:

# F-CI-007 (issue #336): one run per ref — a new push cancels the superseded
# in-progress run instead of queueing a duplicate full-suite execution.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version

      - name: Install coverage.py
        run: python -m pip install --quiet coverage

      # F-TEST-001 (issue #333): measure the shared Python entry points and
      # enforce the pinned floor. The floor lives in .coveragerc
      # ([report] fail_under) — raise it deliberately, never to turn CI green.
      - name: Measure entry-point coverage
        run: bash scripts/coverage-run.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: error

  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version

      # F-CI-002 / F-CI-009 (issue #335): syntax-gate every tracked Python
      # helper, then lint IDD naming conventions (§3.1 branch, §3.2 commit)
      # against the base. checkout is shallow, so fetch main first or
      # origin/main does not exist on pull_request runs; idd-lint skips its
      # branch-name check there (detached HEAD) and on the default branch.
      - name: Compile-check Python sources
        run: python3 -m compileall scripts/ src/shared/scripts/

      - name: IDD lint — branch and commit conventions vs base
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 scripts/idd-lint.py repo --base origin/main

      # ─── Source-level checks — read src/ and docs/ only, so they run before
      # the build and fail fast. A new test belongs here unless it reads dist/
      # or skills/. Every tracked test under tests/ must be invoked by a live
      # step in some workflow under .github/workflows/ — normally this one. The
      # T9 check in the build-script test fails the build for any that is not,
      # and does not count a mention in a comment or in a step disabled by
      # `if: false` / `continue-on-error: true`.
      - name: Source-level checks (fast fail before build)
        run: bash tests/test-init-template-doc-urls-source.sh

      - name: test-idd-lint
        run: bash tests/test-idd-lint.sh

      - name: test-idd-lint-stats-project
        run: bash tests/test-idd-lint-stats-project.sh

      - name: test-idd-lint-structure-350
        run: bash tests/test-idd-lint-structure-350.sh

      - name: test-git-batching-352
        run: bash tests/test-git-batching-352.sh

      - name: test-eval-harness
        run: bash tests/test-eval-harness.sh

      - name: test-eval-creator
        run: bash tests/test-eval-creator.sh

      - name: test-eval-resolver
        run: bash tests/test-eval-resolver.sh

      - name: test-eval-pr-review
        run: bash tests/test-eval-pr-review.sh

      # IDD_EVAL_REQUIRE_SANDBOX turns "no OS network sandbox" from a skip into
      # a failure, so the sandboxed run_eval.sh pass can never silently vanish
      # from CI. A host without user+network namespaces keeps structural
      # coverage only.
      - name: test-eval-triage-autopilot-357
        run: bash tests/test-eval-triage-autopilot-357.sh
        env:
          IDD_EVAL_REQUIRE_SANDBOX: "1"

      - name: test-autopilot-modes
        run: bash tests/test-autopilot-modes.sh

      - name: test-autopilot-partial-merge-dependency-gate
        run: bash tests/test-autopilot-partial-merge-dependency-gate.sh

      - name: test-config-schema-38
        run: bash tests/test-config-schema-38.sh

      - name: test-idd-doctor
        run: bash tests/test-idd-doctor.sh

      - name: test-init-template-schema-parity
        run: bash tests/test-init-template-schema-parity.sh

      - name: test-issue-creator-confidence-191
        run: bash tests/test-issue-creator-confidence-191.sh

      - name: test-issue-pr-review-traceability
        run: bash tests/test-issue-pr-review-traceability.sh

      - name: test-issue-resolver-0d-security
        run: bash tests/test-issue-resolver-0d-security.sh

      - name: test-landing-structure
        run: bash tests/test-landing-structure.sh

      - name: test-webpage-hardening-338
        run: bash tests/test-webpage-hardening-338.sh

      # F-UX-001/003/008/011 (issue #359): reveal gating, changelog <noscript>
      # fallback, clipboard failure state, and no fabricated commit stat.
      - name: test-webpage-ux-correctness-359
        run: bash tests/test-webpage-ux-correctness-359.sh

      # F-UX-002/006/007/009/012 (issue #360): mobile disclosure nav, WCAG AA
      # contrast, scroll-padding-top, 44px touch targets, table overflow.
      - name: test-webpage-ux-a11y-360
        run: bash tests/test-webpage-ux-a11y-360.sh

      - name: test-model-suggestion-124
        run: bash tests/test-model-suggestion-124.sh

      - name: test-model-refresh-326
        run: bash tests/test-model-refresh-326.sh

      - name: test-pre-commit-security
        run: bash tests/test-pre-commit-security.sh

      - name: test-local-pre-commit-hook-340
        run: bash tests/test-local-pre-commit-hook-340.sh

      - name: test-projects-sync
        run: bash tests/test-projects-sync.sh

      - name: test-sync-safety
        run: bash tests/test-sync-safety.sh

      - name: test-coverage-floor-333
        run: bash tests/test-coverage-floor-333.sh

      - name: test-config-search-ceiling-parity-339
        run: bash tests/test-config-search-ceiling-parity-339.sh

      # F-TEST-003 / F-TEST-006 (issue #356): gi-config's four bad-config
      # branches, and the clock pin that keeps test-idd-lint.sh's T25d
      # meaningful at any hour.
      - name: test-config-errors-clock-pin-356
        run: bash tests/test-config-errors-clock-pin-356.sh

      - name: test-gh-invocation-helper-344
        run: bash tests/test-gh-invocation-helper-344.sh

      - name: test-orphaned-doc-cleanup-345
        run: bash tests/test-orphaned-doc-cleanup-345.sh

      # build.sh: compile → verify dist/skills → promote skills/ only on success
      - name: Build and verify skills (update skills/ on success)
        run: ./scripts/build.sh

      - name: Drift check — committed skills/ must match verified build
        run: |
          if ! git diff --exit-code -- skills/; then
            echo "::error::skills/ is out of date. Run ./scripts/build.sh and commit the result."
            exit 1
          fi

      # ─── Built-output checks — these read dist/ or skills/, so they must run
      # after the build above.
      - name: test-build-script
        run: bash tests/test-build-script.sh

      - name: test-init-template-doc-urls-dist
        run: bash tests/test-init-template-doc-urls-dist.sh

      - name: test-flattened-self-contained
        run: bash tests/test-flattened-self-contained.sh

      - name: test-autopilot-portability
        run: bash tests/test-autopilot-portability.sh

      - name: test-flattened-coexistence
        run: bash tests/test-flattened-coexistence.sh

      - name: test-dependency-closure
        run: bash tests/test-dependency-closure.sh

      - name: test-build-determinism
        run: bash tests/test-build-determinism.sh

      - name: test-build-package-split
        run: bash tests/test-build-package-split.sh

      # F-TEST-002 (issue #334): negative mutations must fail build.py, not
      # just positive paths pass.
      - name: test-build-negative-mutations
        run: bash tests/test-build-negative-mutations.sh

      - name: test-skill-line-cap
        run: bash tests/test-skill-line-cap-247.sh

      - name: test-skill-frontmatter-keys-307
        run: bash tests/test-skill-frontmatter-keys-307.sh

      - name: test-consolidated-blocks
        run: bash tests/test-consolidated-blocks-248.sh

      - name: test-bundled-doc-slimming
        run: bash tests/test-bundled-doc-slimming-249.sh

      - name: test-disclosure-gates
        run: bash tests/test-disclosure-gates-250.sh

      - name: test-scripts-pipeline-251
        run: bash tests/test-scripts-pipeline-251.sh

      - name: test-scripts-252
        run: bash tests/test-scripts-252.sh

      - name: test-scripts-253
        run: bash tests/test-scripts-253.sh

      - name: test-scripts-278
        run: bash tests/test-scripts-278.sh

      - name: test-dup-score-perf-353
        run: bash tests/test-dup-score-perf-353.sh

      - name: test-misc-perf-355
        run: bash tests/test-misc-perf-355.sh

      - name: test-bug-sweep-343
        run: bash tests/test-bug-sweep-343.sh

      - name: test-secscan-contract-272
        run: bash tests/test-secscan-contract-272.sh

      - name: test-secscan-policy-274
        run: bash tests/test-secscan-policy-274.sh

      - name: test-autopilot-dependency-cross-repo-192
        run: bash tests/test-autopilot-dependency-cross-repo-192.sh

      - name: test-issue-triage
        run: bash tests/test-issue-triage.sh

      - name: test-issue-creator-modes
        run: bash tests/test-issue-creator-modes.sh

      - name: test-issue-analysis
        run: bash tests/test-issue-analysis.sh

      - name: test-agent-conventions-inline-245
