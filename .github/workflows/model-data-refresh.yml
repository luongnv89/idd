name: model-data-refresh

# Weekly freshness check for the CursorBench model data bundled with
# /issue-creator (issue #326). scripts/gi-model-refresh.py reads the seed's
# last_fetched and only fetches a replacement when it is older than the TTL;
# when the seed is fresher than 1 week the job succeeds while skipping the
# update, and when the fetch or validation fails (exit 4) the job degrades to
# a warning and keeps the current seed.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: model-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version

      - name: Refresh model data when older than 1 week
        id: refresh
        run: |
          set -euo pipefail
          set +e
          python3 scripts/gi-model-refresh.py \
            --seed src/skills/issue-creator/templates/model-data.json \
            > refresh-out.json
          rc=$?
          set -e
          # Exit 4 is the documented degrade (fetch failed or payload did not
          # validate): keep the current seed, warn, succeed. Any other
          # non-zero code is a real failure.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ]; then
            cat refresh-out.json >&2 || true
            exit "$rc"
          fi
          cat refresh-out.json
          # Exit 4 writes nothing to stdout, so the file may be empty — only
          # set outputs when it parses; otherwise degrade to updated=false /
          # outcome=degraded.
          python3 - "$GITHUB_OUTPUT" "$rc" <<'PY'
          import json, sys

          updated = False
          ttl = ""
          try:
              out = json.load(open("refresh-out.json"))
              updated = bool(out.get("updated"))
              raw_ttl = out.get("ttl_days")
              if raw_ttl is not None:
                  ttl = str(raw_ttl)
          except (OSError, ValueError):
              pass
          rc = int(sys.argv[2])
          if rc == 0:
              outcome = "updated" if updated else "fresh"
          else:
              outcome = "degraded"
          with open(sys.argv[1], "a") as fh:
              fh.write(f"updated={str(updated).lower()}\n")
              fh.write(f"outcome={outcome}\n")
              if ttl:
                  fh.write(f"ttl={ttl}\n")
          PY
          rm -f refresh-out.json

      # GITHUB_TOKEN-authored push/PR events do not start another workflow run.
      # Gate publication on the repository's full suite here so refreshed data
      # cannot bypass the same tests required of contributor PRs.
      - name: Test refreshed tree
        if: steps.refresh.outputs.updated == 'true'
        run: git ls-files 'tests/*.sh' | xargs -n1 bash

      - name: Open or update refresh pull request
        id: publish
        if: steps.refresh.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: chore/model-data-refresh
        run: |
          set -euo pipefail
          target="src/skills/issue-creator/templates/model-data.json"
          unexpected="$(git diff --name-only -- . ":(exclude)$target")"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes after refresh/tests:" >&2
            printf '  %s\n' "$unexpected" >&2
            exit 1
          fi

          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "chore(model-data): weekly cursorbench refresh"

          # This static branch is automation-owned. Fetch its exact current tip
          # immediately before push so --force-with-lease rejects concurrent or
          # manual changes instead of overwriting them silently.
          if git ls-remote --exit-code --heads origin \
            refs/heads/chore/model-data-refresh >/dev/null; then
            git fetch --no-tags origin \
              +refs/heads/chore/model-data-refresh:refs/remotes/origin/chore/model-data-refresh
          fi
          git push \
            --force-with-lease=refs/heads/chore/model-data-refresh \
            origin HEAD:refs/heads/chore/model-data-refresh

          prs="$(gh pr list --state open --head "$BRANCH" --base "$BASE_BRANCH" --limit 2 --json number,url)"
          pr_count="$(printf '%s' "$prs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [ "$pr_count" -eq 0 ]; then
            body_file="$RUNNER_TEMP/model-data-refresh-pr.md"
            cat > "$body_file" <<'EOF'
          ## Summary

          Refresh the bundled CursorBench model data after its configured TTL expired.

          ## Test Results

          - Full tracked shell suite passed before publication.
          EOF
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "chore(model-data): weekly cursorbench refresh" \
              --body-file "$body_file"
            action=created
          elif [ "$pr_count" -eq 1 ]; then
            action=updated
          else
            echo "Multiple open refresh PRs target $BRANCH" >&2
            exit 1
          fi

          # Mutations are verified by a fresh JSON read.
          prs="$(gh pr list --state open --head "$BRANCH" --base "$BASE_BRANCH" --limit 2 --json number,url)"
          pr_count="$(printf '%s' "$prs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [ "$pr_count" -ne 1 ]; then
            echo "Expected exactly one open refresh PR, found $pr_count" >&2
            exit 1
          fi
          pr_url="$(printf '%s' "$prs" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["url"])')"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Summarize outcome
        if: always()
        env:
          UPDATED: ${{ steps.refresh.outputs.updated }}
          OUTCOME: ${{ steps.refresh.outputs.outcome }}
          TTL: ${{ steps.refresh.outputs.ttl }}
          PR_ACTION: ${{ steps.publish.outputs.action }}
          PR_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "## Model data refresh"
            echo ""
            if [ "$UPDATED" = "true" ] && [ -n "$PR_URL" ]; then
              echo "✓ CursorBench seed was stale — refresh PR ${PR_ACTION}: ${PR_URL}"
            elif [ "$UPDATED" = "true" ]; then
              echo "✗ CursorBench seed refreshed locally but PR publication failed."
            elif [ "$OUTCOME" = "fresh" ]; then
              ttl="${TTL:-7}"
              echo "✓ Model data fresher than ${ttl} days — skipping update."
            elif [ "$OUTCOME" = "degraded" ]; then
              echo "⚠ Refresh attempted but the current seed was kept — see logs above."
            else
              echo "✗ Model data refresh failed — see logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
