name: Deploy landing page to GitHub Pages

# Publishes landing.html, docs.html (plus the brand assets they reference) to
# GitHub Pages on every push to main. The site is assembled into a _site/
# directory so the repository source tree is never exposed — only the public
# pages and the specific assets they load are deployed.

on:
  push:
    branches: [main]
    paths:
      - landing.html
      - docs.html
      - sitemap.xml
      - robots.txt
      - llms.txt
      - assets/logo/**
      - assets/screenshots/**
      - assets/og/**
      - .github/workflows/pages.yml
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs of older commits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/assets/logo _site/assets/screenshots _site/assets/og
          # Landing page becomes the site index; docs.html is the dedicated docs page.
          cp landing.html _site/index.html
          cp docs.html _site/docs.html
          # Crawl and AI-discovery files for search engines and LLM tools.
          cp sitemap.xml _site/sitemap.xml
          cp robots.txt _site/robots.txt
          cp llms.txt _site/llms.txt
          # Only the assets the page actually references.
          cp assets/logo/*.svg _site/assets/logo/
          cp assets/og/og-card.png                       _site/assets/og/
          cp assets/screenshots/issue-creator.png        _site/assets/screenshots/
          cp assets/screenshots/issue-resolver-11.png    _site/assets/screenshots/
          cp assets/screenshots/issue-triage-suggestion.png _site/assets/screenshots/
          cp assets/screenshots/issue-triage-view.png    _site/assets/screenshots/
          cp assets/screenshots/issue-triage-asm.png     _site/assets/screenshots/
          # Disable Jekyll so files/dirs are served verbatim.
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
